name: Check npm authentication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN_AVAILABLE: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Require existing organization secret access
        if: env.NPM_TOKEN_AVAILABLE != 'true'
        run: |
          echo 'npm authentication: not run (existing NPM_TOKEN unavailable)'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@super-solution'
      - name: Read-only npm identity check
        run: node scripts/check-npm-auth.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
